<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Protected — Jeff van Steijn</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <!-- Apply the visitor's saved site theme before paint (mirrors the main site). -->
        <script>
          (function () {
            try {
              var t = localStorage.getItem('theme');
              if (t) document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
          })();
        </script>

        <style>
            @font-face {
                font-family: "Tiempos";
                src: url('/TiemposHeadlineWeb-Semibold.woff2') format('woff2');
                font-display: swap;
            }
            @font-face {
                font-family: "Inter";
                src: url('/InterVariable.woff2') format('woff2');
                font-weight: 100 900;
                font-display: swap;
            }

            :root {
                --bg: #FDFDFB;
                --card: #ffffff;
                --title: #000;
                --text: #615A47;
                --accent: #DC8638;
                --divider: #EBEBEB;
                --field: #FAF9F5;
            }
            /* Dark via saved site toggle */
            :root[data-theme="dark"] {
                --bg: #000000;
                --card: #111111;
                --title: #ffffff;
                --text: #9C9C9C;
                --accent: #DC8638;
                --divider: #1F1F1F;
                --field: #1a1a1a;
            }
            /* Dark via OS preference, unless the site toggle forced light */
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #000000;
                    --card: #111111;
                    --title: #ffffff;
                    --text: #9C9C9C;
                    --accent: #DC8638;
                    --divider: #1F1F1F;
                    --field: #1a1a1a;
                }
            }

            * { box-sizing: border-box; }

            .staticrypt-html { height: 100%; }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family: "Inter", system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-content { height: 100%; }

            .staticrypt-page {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .staticrypt-form {
                width: 100%;
                max-width: 400px;
                background: var(--card);
                border: 1px solid var(--divider);
                border-radius: 16px;
                padding: 40px;
                text-align: center;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 40px rgba(0, 0, 0, 0.06);
            }

            .staticrypt-eyebrow {
                display: inline-block;
                text-transform: uppercase;
                letter-spacing: 0.14em;
                font-size: 11px;
                font-weight: 600;
                color: var(--accent);
                margin-bottom: 14px;
            }

            .staticrypt-title {
                font-family: "Tiempos", Georgia, serif;
                font-weight: 600;
                color: var(--title);
                font-size: 26px;
                line-height: 1.15;
                letter-spacing: -0.01em;
                margin: 0 0 10px;
            }

            .staticrypt-instructions {
                margin: 0 0 24px;
                font-size: 14px;
                line-height: 1.55;
                color: var(--text);
            }

            .staticrypt-password-container {
                position: relative;
                margin: 0 0 14px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                background: var(--field);
                color: var(--title);
                border: 1px solid var(--divider);
                border-radius: 999px;
                outline: 0;
                font-size: 15px;
                font-family: inherit;
                padding: 14px 46px 14px 18px;
            }
            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: var(--accent);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.5;
                padding: 0;
                position: absolute;
                right: 16px;
                top: 50%;
                transform: translateY(-50%);
            }

            .staticrypt-decrypt-button {
                width: 100%;
                border: 0;
                outline: 0;
                border-radius: 999px;
                background: var(--accent);
                color: #ffffff;
                font-family: inherit;
                font-size: 15px;
                font-weight: 500;
                padding: 14px;
                cursor: pointer;
                transition: filter 0.2s ease;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus {
                filter: brightness(0.94);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin: 0 0 16px;
                font-size: 13px;
                color: var(--text);
            }
            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.2);
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.25em solid var(--divider);
                border-right-color: var(--accent);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }
        </style>
    </head>

                </div>
            </div>
        </div>

        <script>

            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",

                staticryptConfig = /*[|staticrypt_config|]*/ 0;

                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password

                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been

                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;

                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {

                const password = document.getElementById("staticrypt-password").value,

</html>
