<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Colors — jeffvansteijn.nl</title>
<style>
  @font-face { font-family:"Inter"; src:url('https://www.jeffvansteijn.nl/InterVariable.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter",system-ui,sans-serif; background:#f4f3ef; color:#222; }
  .wrap { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:28px; }
  .panel { border-radius:16px; padding:24px; border:1px solid rgba(0,0,0,0.08); }
  .panel.light { background:#FDFDFB; color:#000; }
  .panel.dark  { background:#000;    color:#fff; border-color:#1F1F1F; }
  .panel h2 { font-size:12px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.6; margin:0 0 18px; font-weight:600; }
  .swatches { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .sw { display:flex; align-items:center; gap:12px; }
  .chip { width:44px; height:44px; border-radius:10px; flex:none; border:1px solid rgba(128,128,128,0.25); }
  .meta { font-size:13px; line-height:1.3; }
  .meta b { display:block; font-weight:600; }
  .meta span { opacity:0.55; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel light">
      <h2>Light</h2>
      <div class="swatches">
        <div class="sw"><div class="chip" style="background:#FDFDFB"></div><div class="meta"><b>Base</b><span>#FDFDFB</span></div></div>
        <div class="sw"><div class="chip" style="background:#fff"></div><div class="meta"><b>Card</b><span>#FFFFFF</span></div></div>
        <div class="sw"><div class="chip" style="background:#000"></div><div class="meta"><b>Title</b><span>#000000</span></div></div>
        <div class="sw"><div class="chip" style="background:#615A47"></div><div class="meta"><b>Text</b><span>#615A47</span></div></div>
        <div class="sw"><div class="chip" style="background:#DC8638"></div><div class="meta"><b>Accent</b><span>#DC8638</span></div></div>
        <div class="sw"><div class="chip" style="background:#EBEBEB"></div><div class="meta"><b>Divider</b><span>#EBEBEB</span></div></div>
        <div class="sw"><div class="chip" style="background:#dcdcdc"></div><div class="meta"><b>Hover</b><span>#DCDCDC</span></div></div>
      </div>
    </div>
    <div class="panel dark">
      <h2>Dark</h2>
      <div class="swatches">
        <div class="sw"><div class="chip" style="background:#000"></div><div class="meta"><b>Base</b><span>#000000</span></div></div>
        <div class="sw"><div class="chip" style="background:#111"></div><div class="meta"><b>Card</b><span>#111111</span></div></div>
        <div class="sw"><div class="chip" style="background:#fff"></div><div class="meta"><b>Title</b><span>#FFFFFF</span></div></div>
        <div class="sw"><div class="chip" style="background:#9C9C9C"></div><div class="meta"><b>Text</b><span>#9C9C9C</span></div></div>
        <div class="sw"><div class="chip" style="background:#DC8638"></div><div class="meta"><b>Accent</b><span>#DC8638</span></div></div>
        <div class="sw"><div class="chip" style="background:#1F1F1F"></div><div class="meta"><b>Divider</b><span>#1F1F1F</span></div></div>
        <div class="sw"><div class="chip" style="background:#1a1a1a"></div><div class="meta"><b>Hover</b><span>#1A1A1A</span></div></div>
      </div>
    </div>
  </div>
</body>
</html>
