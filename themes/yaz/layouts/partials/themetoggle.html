<script>
  document.addEventListener('DOMContentLoaded', function () {
    const themeToggleBtn = document.getElementById('theme-toggle');
    if (!themeToggleBtn) return;

    // Built once so the clip is fetched/decoded before the first click.
    const clickSound = new Audio({{ "click.mp3" | relURL }});
    clickSound.preload = 'auto';
    clickSound.volume = 0.4;

    themeToggleBtn.addEventListener('click', function () {
      // Theme switch first — a sound failure must never block theming.
      const currentTheme = document.documentElement.className;
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.className = newTheme;
      localStorage.setItem('theme', newTheme);

      // Rewind so rapid clicks re-trigger instead of being ignored mid-clip.
      clickSound.currentTime = 0;
      const played = clickSound.play();
      if (played && played.catch) played.catch(function () {});
    });
  });
</script>
