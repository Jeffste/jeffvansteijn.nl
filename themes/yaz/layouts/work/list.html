<!doctype html>
<html lang="en">
  {{ partial "head.html" . }}
<body>
  <a class="skip-link" href="#main">Skip to main</a>
  <main id="main">
  <div class="content">
    {{ partial "header.html" . }}
   


    <section class="work-cards">
      {{ .Content }}
      {{ range .Pages.ByDate.Reverse }}
        <a href="{{ .Permalink }}" class="work-card-link">
          <article class="work-card">
            <img src="{{ .Params.image }}" alt="{{ .Title }}" class="work-image" />
            <div class="work-content">
              <h3>{{ .Title }}</h3>
              <p>{{ .Params.description }}</p>
              <span class="work-link">Bekijk project</span>
            </div>
          </article>
        </a>
      {{ end }}
    </section>
    
    
          {{ partial "footer.html" . }}
  </div>
</main>
  <div class="noise"></div>
</body>
</html>
